[project]
name = "skyra-data-wrapper"
version = "0.1.0"
description = "This is a wrapper for Skyra APIs. You can use it to download survey responses and metadata for each survey."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "requests>=2.34.2",
    "tqdm>=4.68.3",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "python-dotenv>=1.2.2",
    "ruff>=0.15.18",
]

[project.urls]
"Homepage" = "https://github.com/navikt/skyra-data-wrapper"
